    console.error('Bundle unpack error:', err);
  }

bove. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, em; margin: 0 0 0 -0.02em; color: #fff;\">\n        <span style=\"display: block;\">I help teams build<\u002Fspan>\n        <span style=\"display: block; background: linear-gradient(92deg, #ffb347 0%, #ff6b57 55%, #ff8fab 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.08em;\">better software with AI.<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size: 18px; line-height: 1.6; margin: 0; max-width: 54ch; color: #cfe6e8;\">Not just faster. Better, and a lot more interesting. I've spent 20 years teaching developers through books, courses, videos and conference talks, and these days most of that energy goes into showing teams how to work with AI without losing their minds or their craft.<\u002Fp>\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n        <a href=\"https://bigmachine.io\" class=\"btn\" style=\"text-decoration: none; white-space: nowrap; padding: 13px 24px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: #13202e; background: linear-gradient(135deg, #ffb347 0%, #ff6b57 100%); box-shadow: 0 10px 30px rgba(255,107,87,.35);\" style-hover=\"filter: brightness(1.06); transform: translateY(-1px);\">Work with me<\u002Fa>\n        <a href=\"https://a.bigmachine.io\" class=\"btn\" style=\"text-decoration: none; white-space: nowrap; padding: 13px 24px; font-size: 15px; font-weight: 700; color: #fff; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06);\" style-hover=\"background: rgba(255,255,255,.14);\">Read the newsletter<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: relative; justify-self: end; width: min(440px, 100%);\">\n      <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 100 100\" style=\"position: absolute; inset: -9%; width: 118%; height: 118%; pointer-events: none;\">\n        <defs><linearGradient id=\"ring-g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2dd4bf\"><\u002Fstop><stop offset=\".5\" stop-color=\"#ffb347\"><\u002Fstop><stop offset=\"1\" stop-color=\"#ff6b57\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n        <circle cx=\"50\" cy=\"50\" r=\"47\" fill=\"none\" stroke=\"url(#ring-g)\" stroke-width=\"1.2\" stroke-dasharray=\"40 14 8 22\" stroke-linecap=\"round\" opacity=\".8\" style=\"transform-box: fill-box; transform-origin: center; animation: spinSlow 40s linear infinite;\"><\u002Fcircle>\n      <\u002Fsvg>\n      <figure style=\"margin: 0; position: relative; aspect-ratio: 4 / 5; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 70px rgba(2,12,24,.55); transform: rotate(-2.5deg);\">\n        <img src=\"80586b22-b0b1-45a6-93c7-4c031001f9c0\" alt=\"Rob Conery\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n        <div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,26,47,0) 55%, rgba(7,26,47,.55) 100%); pointer-events: none;\"><\u002Fdiv>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 1440 110\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: clamp(50px, 7vw, 110px); z-index: 2; display: block;\">\n    <path d=\"M0 70 C 220 120 420 10 720 48 C 1000 84 1200 20 1440 58 L1440 110 L0 110 Z\" fill=\"#f7efe3\"><\u002Fpath>\n  <\u002Fsvg>\n<\u002Fsection>\n\n<main id=\"top\" style=\"max-width: 1200px; margin: 0 auto; padding: 56px clamp(20px, 5vw, 72px) 56px; position: relative; isolation: isolate;\">\n\n  <!-- NUMBERS -->\n  <sc-if value=\"{{ showStats }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"Numbers\" aria-label=\"By the numbers\" style=\"display: flex; flex-wrap: wrap; gap: 20px 24px; align-items: flex-end; padding: 0 0 80px;\">\n    <div style=\"width: 196px; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(145deg, #ffb347, #ff6b57 60%, #ff8fab); display: grid; place-content: center; text-align: center; padding: 24px; color: #fff; box-shadow: 0 20px 40px rgba(255,107,87,.28);\">\n      <p style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.03em; font-size: 42px; line-height: 1; margin: 0;\">30,000+<\u002Fp>\n      <p style=\"font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; margin: 10px 0 0; max-width: 16ch; text-wrap: balance; color: #fff3ea;\">copies of The Imposter's Handbook<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width: 164px; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(145deg, #2dd4bf, #148a8c 70%, #0e6163); display: grid; place-content: center; text-align: center; padding: 20px; margin-bottom: 36px; color: #fff; box-shadow: 0 20px 40px rgba(20,138,140,.28);\">\n      <p style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.03em; font-size: 44px; line-height: 1; margin: 0;\">20+<\u002Fp>\n      <p style=\"font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; margin: 10px 0 0; max-width: 14ch; text-wrap: balance; color: #e6f7f6;\">years teaching developers<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width: 180px; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(145deg, #0f4c6e, #0b2a4a 70%, #071a2f); display: grid; place-content: center; text-align: center; padding: 22px; color: #fff; box-shadow: 0 20px 40px rgba(11,42,74,.30);\">\n      <p style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.03em; font-size: 44px; line-height: 1; margin: 0; background: linear-gradient(90deg, #ffb347, #ff8fab); -webkit-background-clip: text; background-clip: text; color: transparent;\">800+<\u002Fp>\n      <p style=\"font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; margin: 10px 0 0; max-width: 16ch; text-wrap: balance; color: #cfe6e8;\">engineers in one Copilot session<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width: 156px; aspect-ratio: 1; border-radius: 50%; background: var(--color-surface); border: 2px solid var(--color-accent-2-300); display: grid; place-content: center; text-align: center; padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow-sm);\">\n      <p style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.03em; font-size: 44px; line-height: 1; margin: 0; color: var(--color-accent-2-700);\">2006<\u002Fp>\n      <p style=\"font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; margin: 10px 0 0; max-width: 14ch; text-wrap: balance; color: var(--color-neutral-700);\">first conference talk<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- SHORT ABOUT -->\n  <section data-screen-label=\"Short version\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px clamp(32px, 5vw, 80px); padding: 0 0 80px; align-items: start;\">\n    <div>\n      <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-2-700); margin-bottom: 14px;\">The short version<\u002Fspan>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.03em; font-size: clamp(34px, 3.4vw, 48px); line-height: 1.05; margin: 0; background: linear-gradient(92deg, #e85d3f, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.08em; display: inline-block;\">Hi, I'm Rob.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size: 18px; line-height: 1.65; margin: 0; max-width: 60ch;\">I help software teams adopt AI so they can build better software, and I've spent 20 years teaching developers through books, courses, videos, and conference talks. I wrote <a href=\"https://bigmachine.io/offers/imposter-second\">The Imposter's Handbook<\u002Fa>, co-founded Tekpub, made <a href=\"https://thisdeveloperslife.com\">This Developer's Life<\u002Fa> with Scott Hanselman, and worked at Microsoft twice. I live in Honolulu, where I run <a href=\"https://bigmachine.io\">Big Machine<\u002Fa> and I'm building <a href=\"https://kolea.pro\">Kōlea<\u002Fa>.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- NOW -->\n  <section id=\"now\" data-screen-label=\"Now\" style=\"padding: 0 0 80px; display: flex; flex-direction: column; gap: 40px;\">\n    <div style=\"max-width: 640px;\">\n      <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-2-700); margin-bottom: 14px;\">What I'm doing now<\u002Fspan>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; margin: 0 0 20px -0.028em;\">Three things, one person.<\u002Fh2>\n      <p style=\"font-size: 16.5px; line-height: 1.65; margin: 0; max-width: 58ch;\">I've been independent since 2025, working under my own company, Red:4 Aerospace. It started as the fictional company in my book A Curious Moon (its CTO is a character named Rob), and I made it real. Red 4 is Mars, and why call yourself \"Technologies\" when you can start your own aerospace company?<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px;\">\n      <div style=\"background: linear-gradient(180deg, #fffdf8, #fbf3e6); border: 1px solid var(--color-neutral-200); box-shadow: var(--shadow-sm); border-radius: 28px; padding: 32px 28px; display: flex; flex-direction: column; gap: 14px;\">\n        <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-600)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3a3 3 0 0 0-3 3v1a3 3 0 0 0-3 3v1a3 3 0 0 0 0 6v1a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-1a3 3 0 0 0 0-6v-1a3 3 0 0 0-3-3V6a3 3 0 0 0-3-3Z\"><\u002Fpath><path d=\"M9 12h6\"><\u002Fpath><\u002Fsvg>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 24px; line-height: 1.15; margin: 0;\">AI adoption consulting<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Through Big Machine I help companies adopt AI and help teams skill up. Most of the talk is about building software faster. I care about building it better, and about teams turning sets of AI skills into working systems I call machines. I also do forward-deployed engineering when a team wants someone in the room.<\u002Fp>\n        <a href=\"https://bigmachine.io\" style=\"font-weight: 600; font-size: 15px; margin-top: auto;\">Start at bigmachine.io<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background: linear-gradient(180deg, #fffdf8, #fbf3e6); border: 1px solid var(--color-neutral-200); box-shadow: var(--shadow-sm); border-radius: 28px; padding: 32px 28px; display: flex; flex-direction: column; gap: 14px;\">\n        <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-600)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"><\u002Fpath><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z\"><\u002Fpath><\u002Fsvg>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 24px; line-height: 1.15; margin: 0;\">Big Machine<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">My first brand, since 2016, and where the books, courses and newsletter live. Video production is most of what I do day to day. Tens of thousands of students have come through, and The Imposter's Handbook is the book that put it on the map.<\u002Fp>\n        <a href=\"https://a.bigmachine.io\" style=\"font-weight: 600; font-size: 15px; margin-top: auto;\">Read the newsletter<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background: linear-gradient(180deg, #fffdf8, #fbf3e6); border: 1px solid var(--color-neutral-200); box-shadow: var(--shadow-sm); border-radius: 28px; padding: 32px 28px; display: flex; flex-direction: column; gap: 14px;\">\n        <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-600)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 7h.01\"><\u002Fpath><path d=\"M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20\"><\u002Fpath><path d=\"m20 7 2 .5-2 .5\"><\u002Fpath><path d=\"M10 18v3\"><\u002Fpath><path d=\"M14 17.75V21\"><\u002Fpath><path d=\"M7 18a6 6 0 0 0 3.84-10.61\"><\u002Fpath><\u002Fsvg>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 24px; line-height: 1.15; margin: 0;\">Kōlea<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">My first software-as-a-service application, built and run solo, launching soon. It's by far the biggest masterpiece I've ever made, software-wise. More on it below.<\u002Fp>\n        <a href=\"https://kolea.pro\" style=\"font-weight: 600; font-size: 15px; margin-top: auto;\">kolea.pro<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- KOLEA SPOTLIGHT -->\n  <section data-screen-label=\"Kōlea\" style=\"padding: 0 0 96px;\">\n    <div style=\"background: linear-gradient(135deg, #072c2d 0%, #0a4547 35%, #148a8c 75%, #2dd4bf 115%); color: #fff; border-radius: 44px; padding: clamp(32px, 4vw, 56px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 36px clamp(32px, 5vw, 72px); align-items: center; position: relative; overflow: hidden; box-shadow: var(--shadow-lg);\">\n      <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 600 400\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; pointer-events: none; opacity: .35;\">\n        <path d=\"M0 220 C 120 160 220 300 360 230 C 470 175 540 260 600 210 L600 400 L0 400 Z\" fill=\"#2dd4bf\"><\u002Fpath>\n        <path d=\"M0 300 C 150 250 250 360 400 290 C 500 245 560 320 600 290 L600 400 L0 400 Z\" fill=\"#5cc4c0\" opacity=\".7\"><\u002Fpath>\n      <\u002Fsvg>\n      <div style=\"position: relative; display: flex; flex-direction: column; gap: 18px;\">\n        <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: #ffb347;\">Spotlight<\u002Fspan>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.03em; font-size: clamp(30px, 3vw, 42px); line-height: 1.05; margin: 0;\">Kōlea, the full-circle creator platform<\u002Fh2>\n        <p style=\"font-size: 16.5px; line-height: 1.65; margin: 0; max-width: 56ch; color: #d9f5f1;\">You write once and Kōlea sends it to your email list and posts it on your own site. Signup pages, landing pages, a templated blog, and a store that sells through your own Stripe account all live in the same place. It's for people who write and sell what they make: authors, course creators, educators, newsletter writers, podcasters.<\u002Fp>\n        <p style=\"font-size: 16.5px; line-height: 1.65; margin: 0; max-width: 56ch; color: #d9f5f1;\">It started as an experiment to see if I could run my own email list server with sequences. It worked, so I kept going.<\u002Fp>\n        <ul style=\"list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 10px; font-size: 15px; line-height: 1.5; color: #eafaf8;\">\n          <li style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"flex: none; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #ffb347, #ff6b57); transform: translateY(1px);\"><\u002Fspan><span><strong style=\"color: #fff;\">The slop meter.<\u002Fstrong> Scores a draft 0 to 100 for machine-sounding writing, in the browser, with no AI involved.<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"flex: none; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #ffb347, #ff6b57); transform: translateY(1px);\"><\u002Fspan><span><strong style=\"color: #fff;\">The reader council.<\u002Fstrong> AI readers modeled on your audience, plus an editor, review each draft and never change a word.<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"flex: none; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #ffb347, #ff6b57); transform: translateY(1px);\"><\u002Fspan><span><strong style=\"color: #fff;\">Sales attribution.<\u002Fstrong> Every sale traced back to the email that made it. Launch Studio and verified-buyer testimonials come along too.<\u002Fspan><\u002Fli>\n        <\u002Ful>\n        <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 8px;\">\n          <a href=\"https://kolea.pro\" class=\"btn\" style=\"text-decoration: none; white-space: nowrap; padding: 12px 22px; font-size: 15px; font-weight: 700; color: #13202e; background: linear-gradient(135deg, #ffb347 0%, #ff6b57 100%); box-shadow: 0 10px 30px rgba(255,107,87,.3);\" style-hover=\"filter: brightness(1.06);\">See Kōlea<\u002Fa>\n          <span style=\"font-size: 14px; color: #b8ebe6;\">Free for your first 500 subscribers, with free migration from Kit, Ghost, Mailchimp or Drip.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figure style=\"margin: 0; position: relative; width: 100%; aspect-ratio: 5 / 4; border-radius: 32px; overflow: hidden; box-shadow: var(--shadow-md);\">\n        <img src=\"img/kolea.jpg\" alt=\"The Kōlea editor with the slop meter and reader council\" loading=\"lazy\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;\">\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LONG STORY -->\n  <section id=\"story\" data-screen-label=\"Long version\" style=\"position: relative; padding: 0 0 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 40px clamp(32px, 6vw, 96px); align-items: start;\">\n    <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 400 400\" style=\"position: absolute; right: -160px; top: -80px; width: 420px; height: 420px; z-index: -1; pointer-events: none; opacity: .55;\">\n      <defs><linearGradient id=\"blob-g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ffd9d0\"><\u002Fstop><stop offset=\"1\" stop-color=\"#c3ecea\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n      <path d=\"M317 72c42 42 62 110 46 170-16 61-70 112-134 128S94 364 55 318 3 206 22 143 97 36 162 22s113 8 155 50Z\" fill=\"url(#blob-g)\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"display: flex; flex-direction: column; gap: 28px; position: sticky; top: 96px;\">\n      <div>\n        <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-2-700); margin-bottom: 14px;\">The long version<\u002Fspan>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; margin: 0 0 0 -0.028em;\">A geologist walks into a database.<\u002Fh2>\n      <\u002Fdiv>\n      <figure style=\"margin: 0; width: min(380px, 100%); aspect-ratio: 4 / 5; border-radius: 52% 48% 56% 44% / 46% 56% 44% 54%; overflow: hidden; box-shadow: var(--shadow-lg);\">\n        <img src=\"img/speaking_wdcnzbg.jpg\" alt=\"Rob on stage at WDCNZ\" loading=\"lazy\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 82% center; display: block; filter: saturate(0.85) contrast(0.96);\">\n      <\u002Ffigure>\n      <figure style=\"margin: 0; width: min(260px, 100%); aspect-ratio: 1; border-radius: 50%; overflow: hidden; align-self: flex-end; box-shadow: var(--shadow-md);\">\n        <img src=\"img/me-beach.jpeg\" alt=\"Rob on the beach\" loading=\"lazy\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center 40%; display: block;\">\n      <\u002Ffigure>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 22px; font-size: 17px; line-height: 1.7; max-width: 62ch;\">\n      <p style=\"margin: 0;\">I studied geology at UC Santa Barbara, with a minor in computer science, and spent my first five years out of school working as a geologist. I was also the office geek, the one who put all of our analytical data into Access and ran the reports. In 1997 a friend called and asked if I knew you could hook a website up to a database. I didn't, so he showed me, and that was the end of my geology career.<\u002Fp>\n      <p style=\"margin: 0;\">We started a consulting company called Persistent Web that same year. I was the CTO, and we grew to more than 30 developers during the dot-com years. In 2004 I moved to Hawaii with my family, fully intending to quit tech and drive fishing boats. My friends kept calling with work (PayPal, Visa, Starbucks, Google), and then I wrote the Commerce Starter Kit for ASP.NET 2.0. Scott Guthrie called after that and asked if I wanted to work at Microsoft.<\u002Fp>\n      <p style=\"margin: 0;\">I joined the ASP.NET team in 2006 as one of its first developer relations people, working on ASP.NET MVC with Scott Hanselman, Phil Haack, and Scott Guthrie. We wrote Professional ASP.NET MVC 1.0 together and called ourselves the Five Heads, which is a hairline joke. I've also written a few open source data access tools over the years: SubSonic and Massive for .NET, MassiveJS for Node, and Moebius for Elixir.<\u002Fp>\n      <p style=\"margin: 0;\">In 2009 James Avery and I started Tekpub, one of the first online video learning sites for developers. Pluralsight bought it in 2014. Somewhere in there Scott Hanselman and I made a podcast called This Developer's Life, which was the number one tech podcast for a while. That still surprises me.<\u002Fp>\n      <p style=\"margin: 0;\">I started Big Machine in 2016 and published The Imposter's Handbook, a computer science primer for self-taught developers who don't have a CS degree. I spent two years researching it and a year writing it, and then I kept working on it for years after that. It has sold over 30,000 copies. I also wrote A Curious Moon, which is a science fiction story and a Postgres tutorial at the same time. If you ask me which database to use, the answer is Postgres. I think it's the best-run software project in history.<\u002Fp>\n      <p style=\"margin: 0;\">From 2018 to 2025 I was back at Microsoft. I led engineering for Learn TV, then worked with the VS Code team on Copilot, where I built training for the Azure Core engineering team and gave it to 800 people at a time. I also made videos for the VS Code YouTube channel. I've been speaking at conferences since 2006, mostly NDC, including one Node.js talk in Oslo where I never said a word.<\u002Fp>\n      <p style=\"margin: 0;\">These days I work for myself under a company called Red:4 Aerospace. It was a fictional company in A Curious Moon and I made it real. I help teams adopt AI. Most of the talk about AI is about building software faster. I care more about building it better, and making things that are more interesting. I'm also building Kōlea, a newsletter and sales platform for people who write and sell what they make. It's the best software I've ever made.<\u002Fp>\n      <p style=\"margin: 0;\">I've lived in Hawaii for more than 20 years and raised my family here. If you'd like to work together, <a href=\"https://bigmachine.io\">bigmachine.io<\u002Fa> is the place to start.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HISTORY -->\n  <section id=\"history\" data-screen-label=\"Work history\" style=\"padding: 0 0 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 32px clamp(32px, 6vw, 96px); align-items: start;\">\n    <div style=\"position: sticky; top: 96px;\">\n      <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-2-700); margin-bottom: 14px;\">Where I've been<\u002Fspan>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; margin: 0 0 16px -0.028em;\">Founder, CTO, lead engineer. Usually a one-person show.<\u002Fh2>\n      <p style=\"font-size: 15.5px; line-height: 1.6; margin: 0; color: var(--color-neutral-800); max-width: 40ch;\">Newest first. Postgres, Ruby, Elixir and JavaScript along the way, with C# from time to time.<\u002Fp>\n    <\u002Fdiv>\n    <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; gap: 0; grid-column: span 2; max-width: 760px;\">\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">2025 →<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Independent: Red:4 Aerospace, Big Machine, Kōlea<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">CTO of my own company. AI adoption consulting, forward-deployed engineering, video production, and building Kōlea solo.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">2018–2025<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Microsoft, second time around<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Worked with the VS Code team on Copilot: built internal training and delivered it to 800+ people at a time for Azure Core engineering, made videos for the VS Code YouTube channel. Before that, lead engineer on Learn TV, Microsoft's streaming platform for learning. Ran Big Machine the whole time.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">2016 →<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Big Machine<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Courses, books, consulting and a newsletter. Still running.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">2014–2016<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Pluralsight<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Joined as part of the Tekpub acquisition, then left to start Big Machine.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">2009–2014<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Tekpub, co-founder<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Started with James Avery. One of the very first online video learning platforms for developers, and where I built my first audience. Acquired by Pluralsight in 2014.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">2006–2009<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Microsoft, ASP.NET team<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Recruited by Scott Guthrie. Community lead and one of the first developer relations people devoted to ASP.NET MVC, alongside Scott Hanselman and Phil Haack. The four of us wrote Professional ASP.NET MVC 1.0.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">2004–2006<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Independent contractor, Hawaii<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Moved to Hawaii planning to get a captain's license and drive boats. Contracted for PayPal, Visa, Starbucks, Google and eventually Microsoft instead. Wrote the Commerce Starter Kit for ASP.NET 2.0, which led to the call from Scott Guthrie.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">2002–2004<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">CTO, healthcare consultancy<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Took the job to spend more time with my young child after the dot-com years.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--color-divider);\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">1997–2002<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Persistent Web, co-founder and CTO<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Web consulting, started with a friend who was one of the first Microsoft-certified trainers for ASP Classic. Grew to 30+ developers during the boom.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"display: grid; grid-template-columns: 110px 1fr; gap: 8px 20px; padding: 22px 0;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-2-700); padding-top: 4px;\">→ 1997<\u002Fspan>\n        <div><h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 21px; line-height: 1.2; margin: 0 0 6px;\">Geologist<\u002Fh3><p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">About five years. UC Santa Barbara, geology with a CS minor. The office geek who put the firm's analytical data into Access and built the reporting. That's what got me into web development.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fsection>\n\n  <!-- GREATEST HITS -->\n  <section id=\"hits\" data-screen-label=\"Greatest hits\" style=\"position: relative; padding: 0 0 96px; display: flex; flex-direction: column; gap: 36px;\">\n    <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 300 300\" style=\"position: absolute; left: -200px; top: 40px; width: 360px; height: 360px; z-index: -1; pointer-events: none;\">\n      <defs><linearGradient id=\"ring-g2\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2dd4bf\"><\u002Fstop><stop offset=\"1\" stop-color=\"#ffb347\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n      <circle cx=\"150\" cy=\"150\" r=\"130\" fill=\"none\" stroke=\"url(#ring-g2)\" stroke-width=\"22\" opacity=\".35\"><\u002Fcircle>\n    <\u002Fsvg>\n    <div style=\"max-width: 640px;\">\n      <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-2-700); margin-bottom: 14px;\">Greatest hits<\u002Fspan>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; margin: 0 0 0 -0.028em;\">Books, a podcast, and a few things that stuck.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 32px clamp(32px, 5vw, 72px); align-items: start;\">\n      <figure style=\"margin: 0; width: min(300px, 100%); aspect-ratio: 3 / 4; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow-lg); justify-self: start;\">\n        <img src=\"img/imposter-second.jpg\" alt=\"The Imposter's Handbook, second edition\" loading=\"lazy\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;\">\n      <\u002Ffigure>\n      <div style=\"display: flex; flex-direction: column; gap: 18px; grid-column: span 2; max-width: 720px;\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 28px; line-height: 1.15; margin: 0;\"><a href=\"https://bigmachine.io/offers/imposter-second\" style=\"color: inherit; text-decoration: none;\">The Imposter's Handbook<\u002Fa><\u002Fh3>\n        <p style=\"font-size: 16.5px; line-height: 1.65; margin: 0;\">Computer science for people without a degree. I started in 2014 by working through the CS curricula at Stanford, MIT and others: computation, complexity theory, cryptography, algorithms, lambda calculus, data structures. The first edition shipped in 2016 and hit number one on Hacker News. The second edition (2023) is a full rewrite, 550 pages and 12 chapters with hand-drawn sketches. It's the absolute highlight of my career, and I might write another one for the AI age.<\u002Fp>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n          <span class=\"tag tag-accent\">30,000+ copies<\u002Fspan>\n          <span class=\"tag tag-neutral\">Self-published<\u002Fspan>\n          <span class=\"tag tag-neutral\">Video courses too<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px;\">\n      <div style=\"background: linear-gradient(180deg, #fffdf8, #fbf3e6); border: 1px solid var(--color-neutral-200); box-shadow: var(--shadow-sm); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600;\">Podcast<\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 22px; line-height: 1.15; margin: 0;\"><a href=\"https://thisdeveloperslife.com\" style=\"color: inherit; text-decoration: none;\">This Developer's Life<\u002Fa><\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Made with Scott Hanselman. At its peak it was the number one tech podcast. A producer from This American Life called me personally about the name and was gracious about it. That still surprises me.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: linear-gradient(180deg, #fffdf8, #fbf3e6); border: 1px solid var(--color-neutral-200); box-shadow: var(--shadow-sm); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600;\">Book<\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 22px; line-height: 1.15; margin: 0;\">A Curious Moon<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">A science fiction story and a Postgres tutorial at the same time. Deep technically and deep scientifically. Also where Red:4 Aerospace comes from.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: linear-gradient(180deg, #fffdf8, #fbf3e6); border: 1px solid var(--color-neutral-200); box-shadow: var(--shadow-sm); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600;\">Course + book<\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 22px; line-height: 1.15; margin: 0;\">Take Off with Elixir<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">One of the first Big Machine tutorials. Video course plus book. Sold very well.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: linear-gradient(180deg, #fffdf8, #fbf3e6); border: 1px solid var(--color-neutral-200); box-shadow: var(--shadow-sm); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600;\">Book<\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 22px; line-height: 1.15; margin: 0;\">Professional ASP.NET MVC 1.0<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Written with Scott Hanselman, Phil Haack and Scott Guthrie. We called ourselves the Five Heads. Hairline joke.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- OPEN SOURCE -->\n  <section id=\"code\" data-screen-label=\"Open source\" style=\"padding: 0 0 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 32px clamp(32px, 6vw, 96px); align-items: start;\">\n    <div style=\"position: sticky; top: 96px;\">\n      <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-2-700); margin-bottom: 14px;\">Open source<\u002Fspan>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; margin: 0 0 16px -0.028em;\">Code I've left lying around.<\u002Fh2>\n      <p style=\"font-size: 15.5px; line-height: 1.6; margin: 0; color: var(--color-neutral-800); max-width: 40ch;\">Mostly data access, mostly Postgres. The older ones live with their current maintainers now. Everything is at <a href=\"https://github.com/robconery\">github.com/robconery<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"grid-column: span 2; max-width: 760px; display: flex; flex-direction: column; gap: 28px;\">\n      <div>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 20px; margin: 0 0 12px; color: var(--color-accent-700);\">The ones people know me for<\u002Fh3>\n        <sc-raw-table class=\"table\" style=\"font-size: 15px;\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\">Commerce Starter Kit<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">For ASP.NET 2.0, with a big set of videos. Along with the ASP.NET MVC Storefront series, it's how people first came to know me.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\"><a href=\"https://github.com/subsonic/SubSonic-3.0\">SubSonic<\u002Fa><\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">Data access tool extracted from the Starter Kit. One of the first in the Microsoft space, and extremely popular.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\"><a href=\"https://github.com/FransBouma/Massive\">Massive<\u002Fa><\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">A small micro ORM for .NET that kicked off the micro ORM movement in the Microsoft world.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\"><a href=\"https://github.com/dmfay/massive-js\">MassiveJS<\u002Fa><\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">The Node port. Over 5,000 GitHub stars and once GitHub's repo of the day.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\"><a href=\"https://github.com/robconery/moebius\">Moebius<\u002Fa><\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">A functional query tool for Elixir and Postgres. Ten years old and still maintained.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 20px; margin: 0 0 12px; color: var(--color-accent-2-700);\">Keeping warm right now<\u002Fh3>\n        <sc-raw-table class=\"table\" style=\"font-size: 15px;\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\"><a href=\"https://github.com/robconery/dox\">dox<\u002Fa><\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">A document database API for Postgres, written in PL/pgSQL.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\"><a href=\"https://github.com/robconery/pg-auth\">pg-auth<\u002Fa><\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">A complete authentication system built inside Postgres with schemas and functions.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\"><a href=\"https://github.com/robconery/kolea\">kolea<\u002Fa><\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">Broadcasts, drip sequences and transactional email in one Cloudflare Worker.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; white-space: nowrap; padding: 12px 10px 12px 0;\"><a href=\"https://github.com/robconery/champion\">champion<\u002Fa><\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: var(--color-neutral-800);\">An adversarial AI council for your professional life, as a Claude Code plugin.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SPEAKING -->\n  <section id=\"speaking\" data-screen-label=\"Speaking\" style=\"padding: 0 0 96px; display: flex; flex-direction: column; gap: 36px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 28px clamp(32px, 6vw, 96px); align-items: start;\">\n      <div>\n        <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-2-700); margin-bottom: 14px;\">Speaking<\u002Fspan>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; margin: 0 0 0 -0.028em;\">The one where I didn't say a word.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 16px; font-size: 16.5px; line-height: 1.65; max-width: 60ch;\">\n        <p style=\"margin: 0;\">My first talk was MIX06 in Las Vegas, on the ASP.NET starter kit. Terrifying. For years after that I did three or four conferences a year, mostly NDC in Oslo and London, with crowds of 500 to over 1,000. For a while I held NDC's second most popular talk, behind only Troy Hunt.<\u002Fp>\n        <p style=\"margin: 0;\">The one people remember is NDC Oslo 2012. I was supposed to give a talk about the Tekpub API. About five days before, I threw it out and rebuilt the whole thing as a Node.js talk with no speaking at all. I played music and walked the audience through the code. I've keynoted NDC Porto and ElixirDaze, but I don't do it often; my talks tend to be niche and technical rather than broad.<\u002Fp>\n        <p style=\"margin: 0;\">Topics follow whatever I'm building: Node, Postgres, RethinkDB, Elixir, Firebase and serverless, computer science fundamentals, going solo, and most recently AI and Copilot. I'm speaking less right now, I have invitations, and I'm thinking about coming back.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 28px clamp(32px, 6vw, 96px); align-items: start;\">\n      <figure style=\"margin: 0; width: 100%; aspect-ratio: 12 / 5; border-radius: 32px; overflow: hidden; box-shadow: var(--shadow-md);\">\n        <img src=\"img/speaking_wdcnzbg.jpg\" alt=\"A wide shot of Rob speaking at WDCNZ\" loading=\"lazy\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 80% center; display: block;\">\n      <\u002Ffigure>\n      <div style=\"grid-column: span 2; max-width: 760px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 10px;\">\n          <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 20px; margin: 0;\">Conference history<\u002Fh3>\n          <span style=\"font-size: 13px; color: var(--color-neutral-700);\">Talk titles are working titles from my own files.<\u002Fspan>\n        <\u002Fdiv>\n        <sc-raw-table class=\"table\" style=\"font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 72px;\">Year<\u002Fsc-raw-th><sc-raw-th>Conferences and talks<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ talks }}\" as=\"t\" hint-placeholder-count=\"12\">\n              <sc-raw-tr><sc-raw-td style=\"font-family: var(--font-heading); font-weight: 700; color: var(--color-accent-2-700); padding: 11px 9px;\">{{ t.year }}<\u002Fsc-raw-td><sc-raw-td style=\"padding: 11px 9px; color: var(--color-neutral-800);\">{{ t.what }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LATEST -->\n  <section id=\"latest\" data-screen-label=\"Latest\" style=\"padding: 0 0 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px clamp(32px, 6vw, 96px); align-items: start;\">\n    <div>\n      <span style=\"display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-2-700); margin-bottom: 14px;\">Latest<\u002Fspan>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; margin: 0 0 0 -0.028em;\">Fresh off the press.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"grid-column: span 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; max-width: 760px;\">\n      <a href=\"https://a.bigmachine.io/ai/why-i-stopped-writing-exacting-prompts\" style=\"text-decoration: none; color: inherit; background: var(--color-accent-100); border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 10px;\" style-hover=\"background: var(--color-accent-200);\">\n        <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600; display: flex; gap: 8px; align-items: center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"20\" height=\"16\" x=\"2\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"><\u002Fpath><\u002Fsvg>Newsletter · Sep 28, 2026<\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 22px; line-height: 1.15; margin: 0;\">Why I stopped writing exacting prompts<\u002Fh3>\n      <\u002Fa>\n      <a href=\"https://www.youtube.com/watch?v=jo2n33Di0fs\" style=\"text-decoration: none; color: inherit; background: var(--color-accent-2-100); border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 10px;\" style-hover=\"background: var(--color-accent-2-200);\">\n        <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-2-800); font-weight: 600; display: flex; gap: 8px; align-items: center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polygon points=\"6 3 20 12 6 21 6 3\"><\u002Fpolygon><\u002Fsvg>Video · Jun 9, 2026<\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.025em; font-size: 22px; line-height: 1.15; margin: 0;\">Why Claude Writes Better Code Than I Do<\u002Fh3>\n      <\u002Fa>
